name: ELABS keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ELABS (budzi Render, nie usypia)
        run: |
          for u in /sw.js /; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://elabs-jrch.onrender.com$u")
            echo "$u -> $code"
          done